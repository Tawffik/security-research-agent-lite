name: Security Research
on:
  workflow_dispatch:
    inputs:
      engagement_id:
        description: Engagement id
        default: eng_gha
      recon_path:
        description: Path to recon JSON in repo (or use artifact download step)
        default: examples/fixtures/bbci_recon_sample.json
      scenario:
        description: Local lab scenario for evidence discrimination
        default: positive
        type: choice
        options: [positive, secure, public, shared, ambiguous]
      use_llm:
        description: Enable LLM hypothesis proposals (uses LLM_API_KEY secret if set)
        type: boolean
        default: true
      require_llm:
        description: Fail if LLM_API_KEY is missing
        type: boolean
        default: false
      mode:
        description: Run mode
        type: choice
        default: analysis
        options: [analysis, synthetic]

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Unit tests
        run: pytest -q
      - name: Research run
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: |
          set -e
          ARGS=(
            --recon "${{ inputs.recon_path }}"
            --scope config/scope.yaml
            --scenario "${{ inputs.scenario }}"
            --engagement-id "${{ inputs.engagement_id }}"
            --artifacts-dir artifacts
            --mode "${{ inputs.mode }}"
          )
          if [ "${{ inputs.use_llm }}" = "true" ]; then
            ARGS+=(--use-llm)
          fi
          if [ "${{ inputs.require_llm }}" = "true" ]; then
            ARGS+=(--require-llm)
          fi
          python -m agent_lite.cli "${ARGS[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: research-artifacts
          path: artifacts/
