# Mobile-friendly primary runtime for Security Research Agent Lite
name: Security Research Agent
on:
  workflow_dispatch:
    inputs:
      engagement_id:
        description: "Engagement (local recon if no BBCI download)"
        required: true
        default: eng_demo
        type: choice
        options:
          - eng_demo
          - eng_gha
          - eng_sample
      recon_artifact:
        description: "Optional local recon path (ignored if BBCI run/artifact set)"
        required: false
        default: ""
      bbci_repo:
        description: "BugBountyCI GitHub repo (owner/name)"
        required: false
        default: "Tawffik/BugBountyCI"
      bbci_run_id:
        description: "BugBountyCI Actions run id (e.g. 36172103533)"
        required: false
        default: ""
      bbci_artifact_id:
        description: "Optional artifact id (e.g. 10887715536)"
        required: false
        default: ""
      bbci_artifact_name:
        description: "Optional artifact name substring filter"
        required: false
        default: ""
      model_profile:
        description: "LLM profile: free | mock"
        required: true
        default: free
        type: choice
        options:
          - free
          - mock
      execution_mode:
        description: "analysis=lab | http=live target (needs AUTHORIZED + session secrets)"
        required: true
        default: analysis
        type: choice
        options:
          - analysis
          - synthetic
          - http
      scenario:
        description: "Local discrimination scenario"
        required: true
        default: positive
        type: choice
        options:
          - positive
          - secure
          - public
          - shared
          - ambiguous
      auth_profile:
        description: "Auth profile"
        type: choice
        default: ""
        options:
          - ""
          - two_test_users_mock
          - two_test_users
          - two_test_users_mailslurp
          - two_test_users_temp
          - manual
      browser_runtime:
        description: "none|fake|playwright|mcp (mcp needs MCP_BROWSER_URL secret)"
        type: choice
        default: "none"
        options:
          - none
          - fake
          - playwright
          - mcp
      confirm_authorized:
        description: "Type AUTHORIZED to allow live HTTP (http mode only)"
        required: false
        default: ""
      http_base_url:
        description: "Optional override base URL (else from recon primary_host)"
        required: false
        default: ""
      http_object_path:
        description: "Optional object path (else picked from recon endpoints)"
        required: false
        default: ""
      require_llm:
        description: "Fail if LLM API key missing"
        type: boolean
        default: false

jobs:
  research:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Install browser runtime
        if: ${{ inputs.browser_runtime == 'playwright' || inputs.execution_mode == 'http' }}
        run: |
          pip install -e ".[browser]"
          python -m playwright install --with-deps chromium
      - name: Tests
        run: pytest -q
      - name: Fetch BugBountyCI artifact
        id: bbci
        if: ${{ inputs.bbci_run_id != '' || inputs.bbci_artifact_id != '' }}
        env:
          BBCI_READ_TOKEN: ${{ secrets.BBCI_READ_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python -m agent_lite.recon.bbci_artifact \
            --repo "${{ inputs.bbci_repo }}" \
            --run-id "${{ inputs.bbci_run_id }}" \
            --artifact-id "${{ inputs.bbci_artifact_id }}" \
            --artifact-name "${{ inputs.bbci_artifact_name }}" \
            --work-dir artifacts/bbci_download \
            | tee artifacts/bbci_resolve.json
          STATUS=$(python -c "import json; print(json.load(open('artifacts/bbci_resolve.json'))['status'])")
          if [ "$STATUS" != "ok" ]; then
            echo "BBCI artifact resolve failed"
            cat artifacts/bbci_resolve.json
            exit 1
          fi
          RECON=$(python -c "import json; print(json.load(open('artifacts/bbci_resolve.json'))['recon_path'])")
          echo "recon_path=$RECON" >> "$GITHUB_OUTPUT"
          echo "Resolved recon: $RECON"
      - name: Research
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_BASE_URL: ${{ secrets.OPENROUTER_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          MAILSLURP_API_KEY: ${{ secrets.MAILSLURP_API_KEY }}
          TEMP_MAIL_API_KEY: ${{ secrets.TEMP_MAIL_API_KEY }}
          TEMP_MAIL_BASE_URL: ${{ secrets.TEMP_MAIL_BASE_URL }}
          BROWSER_MCP_ENABLED: ${{ secrets.BROWSER_MCP_ENABLED }}
          BROWSER_RUNTIME: ${{ inputs.browser_runtime }}
          MCP_BROWSER_URL: ${{ secrets.MCP_BROWSER_URL }}
          MCP_BROWSER_TOKEN: ${{ secrets.MCP_BROWSER_TOKEN }}
          TEST_USER_A_TOKEN: ${{ secrets.TEST_USER_A_TOKEN }}
          TEST_USER_A_COOKIE: ${{ secrets.TEST_USER_A_COOKIE }}
          TEST_USER_B_TOKEN: ${{ secrets.TEST_USER_B_TOKEN }}
          TEST_USER_B_COOKIE: ${{ secrets.TEST_USER_B_COOKIE }}
          USER_A_TOKEN: ${{ secrets.USER_A_TOKEN }}
          USER_A_COOKIE: ${{ secrets.USER_A_COOKIE }}
          USER_B_TOKEN: ${{ secrets.USER_B_TOKEN }}
          USER_B_COOKIE: ${{ secrets.USER_B_COOKIE }}
          TEST_USER_A_EMAIL: ${{ secrets.TEST_USER_A_EMAIL }}
          TEST_USER_A_PASSWORD: ${{ secrets.TEST_USER_A_PASSWORD }}
          TEST_USER_B_EMAIL: ${{ secrets.TEST_USER_B_EMAIL }}
          TEST_USER_B_PASSWORD: ${{ secrets.TEST_USER_B_PASSWORD }}
          LOGIN_URL: ${{ secrets.LOGIN_URL }}
          LOGIN_PATH: ${{ secrets.LOGIN_PATH }}
          MAILSLURP_API_KEY: ${{ secrets.MAILSLURP_API_KEY }}
        run: |
          set -euo pipefail
          ARGS=(
            --engagement-id "${{ inputs.engagement_id }}"
            --model-profile "${{ inputs.model_profile }}"
            --mode "${{ inputs.execution_mode }}"
            --scenario "${{ inputs.scenario }}"
            --artifacts-dir artifacts
            --repo-root .
          )
          if [ -n "${{ steps.bbci.outputs.recon_path }}" ]; then
            ARGS+=(--recon "${{ steps.bbci.outputs.recon_path }}")
          elif [ -n "${{ inputs.recon_artifact }}" ]; then
            ARGS+=(--recon "${{ inputs.recon_artifact }}")
          fi
          if [ "${{ inputs.require_llm }}" = "true" ]; then
            ARGS+=(--require-llm)
          fi
          AUTH="${{ inputs.auth_profile }}"
          if [ -n "$AUTH" ]; then
            ARGS+=(--auth-profile "$AUTH")
          fi
          if [ "${{ inputs.execution_mode }}" = "http" ]; then
            ARGS+=(--authorized "${{ inputs.confirm_authorized }}")
            if [ -n "${{ inputs.http_base_url }}" ]; then
              ARGS+=(--http-base-url "${{ inputs.http_base_url }}")
            fi
            if [ -n "${{ inputs.http_object_path }}" ]; then
              ARGS+=(--http-object-path "${{ inputs.http_object_path }}")
            fi
          fi
          python -m agent_lite.cli "${ARGS[@]}"
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: research-${{ inputs.engagement_id }}
          path: artifacts/
