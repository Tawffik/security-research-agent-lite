# Mobile-friendly primary runtime for Security Research Agent Lite
name: Security Research Agent
on:
  workflow_dispatch:
    inputs:
      engagement_id:
        description: "Engagement (resolves recon from config/engagements/index.yaml)"
        required: true
        default: eng_demo
        type: choice
        options:
          - eng_demo
          - eng_gha
          - eng_sample
      recon_artifact:
        description: "Optional explicit recon path (overrides engagement map)"
        required: false
        default: ""
      model_profile:
        description: "LLM profile: free (auto free models) | mock | or leave free"
        required: true
        default: free
        type: choice
        options:
          - free
          - mock
      execution_mode:
        description: "analysis = recon+LLM+BOLA lab path (safe default)"
        required: true
        default: analysis
        type: choice
        options:
          - analysis
          - synthetic
      scenario:
        description: "Local discrimination scenario (evidence lab)"
        required: true
        default: positive
        type: choice
        options:
          - positive
          - secure
          - public
          - shared
          - ambiguous
      auth_profile:
        description: "two_test_users runs mock OTP identity bootstrap (offline-safe)"
        type: choice
        default: ""
        options:
          - ""
          - two_test_users
      require_llm:
        description: "Fail if OPENROUTER_API_KEY / LLM_API_KEY missing"
        type: boolean
        default: false

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Tests
        run: pytest -q
      - name: Research
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_BASE_URL: ${{ secrets.OPENROUTER_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: |
          set -euo pipefail
          ARGS=(
            --engagement-id "${{ inputs.engagement_id }}"
            --model-profile "${{ inputs.model_profile }}"
            --mode "${{ inputs.execution_mode }}"
            --scenario "${{ inputs.scenario }}"
            --artifacts-dir artifacts
            --repo-root .
          )
          RECON="${{ inputs.recon_artifact }}"
          if [ -n "$RECON" ]; then
            ARGS+=(--recon "$RECON")
          fi
          if [ "${{ inputs.require_llm }}" = "true" ]; then
            ARGS+=(--require-llm)
          fi
          AUTH="${{ inputs.auth_profile }}"
          if [ -n "$AUTH" ]; then
            ARGS+=(--auth-profile "$AUTH")
          fi
          python -m agent_lite.cli "${ARGS[@]}"
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: research-${{ inputs.engagement_id }}
          path: artifacts/
