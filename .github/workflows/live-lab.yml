# Authorized live-lab execution only.
# NEVER runs on push. Requires explicit workflow_dispatch + secrets + engagement config.
name: Live Lab (explicit dispatch only)

on:
  workflow_dispatch:
    inputs:
      engagement_config:
        description: "Path to engagement YAML under config/engagements/"
        required: true
        default: "config/engagements/synthetic_bola.yaml"
      engagement_id:
        description: "Engagement id"
        required: true
        default: "eng_live_dispatch"
      confirm_authorized:
        description: "Type AUTHORIZED to confirm scope and authorization"
        required: true
        default: ""

jobs:
  live:
    runs-on: ubuntu-24.04
    # Fail closed if confirmation missing
    if: ${{ github.event.inputs.confirm_authorized == 'AUTHORIZED' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit + synthetic suite (always)
        run: pytest -q
      - name: Guard — require engagement file
        run: |
          test -f "${{ github.event.inputs.engagement_config }}"
          echo "Engagement config present"
      - name: Note on secrets
        run: |
          echo "Credentials must come from GitHub Secrets (TEST_USER_A_*, TEST_USER_B_*)."
          echo "They are never written to artifacts."
          # Do not print env or secret values.
      - name: Adapter dry-run (no live network unless engagement authorized + secrets present)
        env:
          TEST_USER_A_COOKIE: ${{ secrets.TEST_USER_A_COOKIE }}
          TEST_USER_B_COOKIE: ${{ secrets.TEST_USER_B_COOKIE }}
          TEST_USER_A_TOKEN: ${{ secrets.TEST_USER_A_TOKEN }}
          TEST_USER_B_TOKEN: ${{ secrets.TEST_USER_B_TOKEN }}
        run: |
          set -e
          echo "confirm_authorized=AUTHORIZED received; engagement file present."
          echo "PortSwiggerAdapter validates engagement fail-closed; live Academy traffic only if"
          echo "engagement.authorized=true AND secrets supply session material AND operator runs T4."
          python - <<'PY'
          from pathlib import Path
          from agent_lite.http.engagement import load_engagement
          from agent_lite.labs.portswigger import PortSwiggerAdapter
          path = Path("${{ github.event.inputs.engagement_config }}")
          eng = load_engagement(path)
          result = PortSwiggerAdapter(eng).validate()
          print(result.to_dict())
          if eng.authorized and result.status == "READY":
              print("ENGAGEMENT_READY — operator may proceed with T4 session inject + run_http")
          else:
              print("ENGAGEMENT_BLOCKED_OR_TEMPLATE — no live traffic from this step")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-lab-artifacts
          path: artifacts/
          if-no-files-found: ignore
